<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f24" />
      <stop offset="50%" stop-color="#1b143f" />
      <stop offset="100%" stop-color="#090a18" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="url(#neonPink)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Headphones Arch -->
  <path d="M 128 260 C 128 140, 384 140, 384 260" fill="none" stroke="url(#neonPink)" stroke-width="28" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 128 260 C 128 140, 384 140, 384 260" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8" />

  <!-- Left Ear Cup -->
  <rect x="100" y="240" width="46" height="84" rx="23" fill="url(#neonPink)" filter="url(#glow)" />
  <rect x="100" y="240" width="46" height="84" rx="23" fill="url(#neonCyan)" opacity="0.4" />
  
  <!-- Right Ear Cup -->
  <rect x="366" y="240" width="46" height="84" rx="23" fill="url(#neonPink)" filter="url(#glow)" />
  <rect x="366" y="240" width="46" height="84" rx="23" fill="url(#neonCyan)" opacity="0.4" />

  <!-- Equalizer / Wave Bars in Center -->
  <g transform="translate(196, 230)" filter="url(#glow)">
    <rect x="0" y="30" width="14" height="40" rx="7" fill="url(#neonCyan)" />
    <rect x="26" y="10" width="14" height="80" rx="7" fill="url(#neonPink)" />
    <rect x="52" y="0" width="14" height="100" rx="7" fill="url(#neonCyan)" />
    <rect x="78" y="20" width="14" height="60" rx="7" fill="url(#neonPink)" />
    <rect x="104" y="35" width="14" height="30" rx="7" fill="url(#neonCyan)" />
  </g>

  <!-- Musical Note or Mystery Question Mark -->
  <path d="M 230 380 Q 256 360 280 380 T 260 410" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-linecap="round" />
  <circle cx="260" cy="435" r="6" fill="url(#neonCyan)" filter="url(#glow)" />
</svg>
